name: Import DevFlow submission

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project
        env:
          ZIP_B64: |
            [...]
        run: |
          set -e
          mkdir -p /tmp/devflow
          printf '%s' "$ZIP_B64" | base64 -d > /tmp/devflow.zip
          unzip -q /tmp/devflow.zip -d /tmp/devflow
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/devflow/. .
          rm -f .github/workflows/import-devflow.yml

      - name: Commit complete project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete DevFlow internship submission" || exit 0
          git push origin main
